version: '3.8'

services:
  language-detection:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/language_detection.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - language-detection
    restart: unless-stopped
